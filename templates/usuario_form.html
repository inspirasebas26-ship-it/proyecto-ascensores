<!DOCTYPE html>                                   <!-- Documento HTML5 -->
<html lang="es">                                  <!-- En español -->
<head>
    <meta charset="UTF-8">                                                  <!-- Para que salgan bien las tildes y la ñ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Para que se vea bien en el celular -->
    <!-- Nuestro CSS. La ruta es relativa (../ = "suba una carpeta"), así funciona abriendo el archivo
         directo en Visual Studio Code y también cuando corremos la página con Flask -->
    <link rel="stylesheet" href="../static/css/styles.css">
    <!-- Nuestro JavaScript de validaciones; "defer" = cárguelo cuando termine de leer el HTML -->
    <script src="../static/js/validaciones.js" defer></script>
    <title>Editar Usuario - Ascensores SENA</title>
</head>
<body>

    <!-- ===================================================================
         Barra de navegación. Las instrucciones de Jinja (los "if") van metidas
         dentro de comentarios HTML: Flask igual las ejecuta y escoge qué links
         mostrar, pero si abren el archivo suelto el navegador no las muestra.
         =================================================================== -->
    <nav>
        <a href="../templates/index.html">Inicio</a>                         <!-- Este link siempre sale -->
        <!-- {% if session.get('usuario_id') %} -->                          <!-- Si ya inició sesión... -->
        <a href="../templates/productos.html">Catálogo</a>                   <!-- ...le mostramos el catálogo -->
        <!-- {% if session.get('rol') == 'administrador' %} -->             <!-- Y si además es admin... -->
        <a href="../templates/admin.html">Panel</a>                          <!-- ...le salen sus links extra -->
        <a href="../templates/admin_productos.html">Productos</a>
        <a href="../templates/admin_usuarios.html">Usuarios</a>
        <a href="../templates/admin_mensajes.html">Mensajes</a>
        <!-- {% endif %} -->                                                <!-- Fin de los links del admin -->
        <a href="{{ url_for('logout') }}">Cerrar sesión</a>                 <!-- Botón para salir -->
        <!-- {% else %} -->                                                 <!-- Si NO ha iniciado sesión... -->
        <a href="../templates/login.html">Iniciar Sesión</a>                 <!-- ...le ofrecemos entrar -->
        <a href="../templates/register.html">Registrarse</a>                 <!-- ...o registrarse -->
        <!-- {% endif %} -->
        <a href="../templates/contacto.html">Contacto</a>                    <!-- Contacto lo ve todo el mundo -->
    </nav>

    <div class="formulario-contenedor">
        <h2>Editar Usuario</h2>
        <!-- El correo no se deja cambiar porque es con lo que la persona inicia sesión -->
        <p class="texto-gris">{{ usuario.correo }}</p>

        <!-- Avisos que manda Python con flash() (rojos si son error, verdes si salió bien).
             Truco: avisos() es una función de app.py que "abre" este comentario para pintar los avisos.
             Si abren el archivo suelto, el navegador lo ve como comentario y no muestra nada raro. -->
        <!-- {{ avisos() }} -->
        <!-- Cajita escondida donde el JavaScript escribe sus errores antes de mandar el formulario -->
        <div id="errores-js" class="mensaje-error oculto"></div>

        <form action="{{ url_for('usuario_editar', id=usuario.id) }}" method="POST" onsubmit="return validarUsuario(this)">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required maxlength="100"
                   pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü ]+" title="Solo letras y espacios" value="{{ usuario.nombre }}">

            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido" required maxlength="100"
                   pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü ]+" title="Solo letras y espacios" value="{{ usuario.apellido }}">

            <label for="telefono">Teléfono (opcional)</label>
            <input type="tel" id="telefono" name="telefono" maxlength="15"
                   pattern="\+?[0-9 ]{7,15}" title="Entre 7 y 15 números" value="{{ usuario.telefono or '' }}">

            <label for="rol_id">Rol</label>
            <!-- Lista con los roles de la tabla roles; dejamos escogido el que ya tiene -->
            <select id="rol_id" name="rol_id" required>
                <!-- {% for r in roles %} -->
                    <option value="{{ r.id }}" {% if r.id == usuario.rol_id %}selected{% endif %}>{{ r.nombre }}</option>
                <!-- {% endfor %} -->
            </select>

            <!-- Si se desmarca, el usuario ya no puede iniciar sesión -->
            <label class="label-check">
                <input type="checkbox" name="activo" value="1" {% if usuario.activo %}checked{% endif %}>
                Usuario activo (puede iniciar sesión)
            </label>

            <button type="submit" class="btn">Guardar cambios</button>
        </form>

        <p class="texto-centrado"><a href="../templates/admin_usuarios.html">Cancelar y volver</a></p>
    </div>

    <!-- Pie de página -->
    <footer>
        &copy; 2026 Ascensores SENA - Proyecto formativo de Análisis y Desarrollo de Software
    </footer>

</body>
</html>
