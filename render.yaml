# =====================================================================
# render.yaml - Las instrucciones para que Render publique nuestra página
# Render lee este archivo y ya sabe cómo instalar y arrancar el proyecto.
# =====================================================================
services:
  - type: web                                  # Es una página web
    name: ascensores-sena                      # Nombre del servicio (sale en la URL: ascensores-sena.onrender.com)
    runtime: python                            # Está hecha en Python
    plan: free                                 # Plan gratuito
    buildCommand: pip install -r requirements.txt   # Lo que corre para instalar las librerías
    startCommand: gunicorn app:app             # Lo que corre para arrancar: "del archivo app.py, use la variable app"
    envVars:                                   # Variables de entorno (los datos de la base de Aiven)
      - key: DB_HOST
        sync: false                            # sync: false = Render nos pregunta el valor al crear el servicio
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: defaultdb                       # En Aiven la base ya viene creada con este nombre
      - key: SECRET_KEY
        generateValue: true                    # Render inventa una clave secreta segura para las sesiones
